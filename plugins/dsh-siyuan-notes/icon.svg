<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SiYuan Notes">
  <title>SiYuan Notes</title>
  <!-- backdrop -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#111A33"/>
  <!-- back page (stacked sheet) -->
  <rect x="12" y="10" width="30" height="34" rx="4" fill="#3B55D9"/>
  <!-- front page -->
  <rect x="20" y="16" width="30" height="34" rx="4" fill="#F8FAFC"/>
  <!-- text lines -->
  <rect x="26" y="24" width="18" height="3.5" rx="1.75" fill="#93A3BC"/>
  <rect x="26" y="30.5" width="18" height="3.5" rx="1.75" fill="#93A3BC"/>
  <rect x="26" y="37" width="11" height="3.5" rx="1.75" fill="#93A3BC"/>
  <!-- pen body -->
  <path d="M44 41 L58 27 L62 31 L48 45 Z" fill="#FFC53D"/>
  <!-- pen nib, writing end -->
  <path d="M44 41 L48 45 L38.5 48.5 Z" fill="#FDE68A"/>
