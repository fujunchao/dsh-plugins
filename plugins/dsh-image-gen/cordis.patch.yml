# dsh-image-gen bundle patch
#
# 往 profile 里插一行。宿主半（package "."）注册 generate_image / edit_image 两个工具；
# 浏览器半（exports["./client"]）提供「设置 → 图片生成」卡片与回环测试 API。设置卡保存即生效，
# Config 字段都是 volatile 活视图，行里的值只作为初始默认。
#
# 行配置（只写与代码默认值不同的两项，其余一律走 Config 默认，避免把个人端点和私有模型名带进仓库）：
#   apiKeyEnv      OPENAI_API_KEY   凭据 ref 名。代码默认是 IMAGE_GEN_API_KEY，并会把 OPENAI_API_KEY
#                                   作为兜底；这里直接用通用的 OPENAI_API_KEY，新装用户凭据库里
#                                   通常已经有它。想用专用名字就到设置卡里改回 IMAGE_GEN_API_KEY。
#   timeoutSeconds 600              单次请求超时（Config 限定 30–900）。默认 300 对 high 质量大图
#                                   偏紧，600 给高质图留余量。
# 不写 baseURL / model：Config 默认是官方 https://api.openai.com/v1 与 gpt-image-2.5，
# 由用户在设置卡里按自己的端点覆盖。
- insert:
    - id: image-gen
      name: 'dsh-image-gen'
      config:
        apiKeyEnv: OPENAI_API_KEY
        timeoutSeconds: 600
